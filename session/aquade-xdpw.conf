# xdg-desktop-portal-wlr in a AquaDE session (XDG_CURRENT_DESKTOP=AquaDE):
# screen sharing from a browser or a video call. Its usual ways of asking
# which screen to share (slurp, wofi, bemenu) need wlr-layer-shell, which
# AquaDE does not offer, so AquaDE's own asks, in an ordinary window: the
# screens are handed to it one a line, and it says which (with one screen
# it does not ask).
[screencast]
chooser_type=dmenu
chooser_cmd=@CHOOSER@
